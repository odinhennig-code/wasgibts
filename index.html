<script>/* Farben sofort setzen, bevor das iPhone die Farbe der oberen Leiste übernimmt */
(function(){try{var L=JSON.parse(localStorage.getItem('wasgibts.local'))||{},r=document.documentElement,d=new Date(),m=d.getMonth(),t=d.getDate();
if(L.theme&&L.theme!=='system')r.setAttribute('data-theme',L.theme);

if(L.tz)r.style.setProperty('--tz',L.tz);
var bg=getComputedStyle(r).getPropertyValue('--bg').trim();if(bg)document.querySelectorAll('meta[name=theme-color]').forEach(function(x){if(L.theme&&L.theme!=='system')x.removeAttribute('media');x.setAttribute('content',bg);});}catch(e){}})();</script>
