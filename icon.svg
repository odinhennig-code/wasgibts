<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs><clipPath id="rr"><rect width="512" height="512" rx="114"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2DB57B"/><stop offset="1" stop-color="#157046"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".75" stop-color="#F4F6F4"/><stop offset="1" stop-color="#DDE3DF"/></linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF1EE"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9AA6A0"/><stop offset=".45" stop-color="#E8EDEA"/><stop offset="1" stop-color="#7E8A84"/></linearGradient>
    <radialGradient id="mag" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#FF8466"/><stop offset=".6" stop-color="#EB5A3C"/><stop offset="1" stop-color="#C8442A"/></radialGradient>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#06301C" flood-opacity=".45"/></filter>
    <filter id="sh2" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".28"/></filter>
  </defs><g clip-path="url(#rr)">
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- Kühlschrank -->
  <g filter="url(#sh)">
    <rect x="140" y="76" width="232" height="368" rx="42" fill="url(#body)"/>
  </g>
  <!-- Türen -->
  <rect x="150" y="86" width="212" height="118" rx="34" ry="34" fill="url(#door)"/>
  <rect x="150" y="214" width="212" height="220" rx="34" fill="url(#door)"/>
  <rect x="150" y="204" width="212" height="10" fill="#C9D2CC"/>
  <rect x="150" y="204" width="212" height="2" fill="#B5C0B9"/>
  <!-- Griffe -->
  <rect x="330" y="126" width="12" height="54" rx="6" fill="url(#chrome)"/>
  <rect x="330" y="236" width="12" height="96" rx="6" fill="url(#chrome)"/>
  <!-- Glanzkante -->
  <rect x="156" y="92" width="8" height="330" rx="4" fill="#fff" opacity=".9"/>
  <!-- Fragezeichen-Magnet -->
  <g filter="url(#sh2)">
    <circle cx="244" cy="312" r="54" fill="url(#mag)"/>
  </g>
  <path d="M226 296a19 19 0 1 1 28 17c-7 4-10 9-10 16" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <circle cx="244" cy="346" r="7" fill="#fff"/>
  <ellipse cx="228" cy="284" rx="16" ry="9" fill="#fff" opacity=".22" transform="rotate(-30 228 284)"/>
</g></svg>
